spring.application.name=api-gateway
server.port=8080

management.endpoints.web.exposure.include=health,info

jwt.secret=${JWT_SECRET:cXVhbnRpdHktbWVhc3VyZW1lbnQtZGV2LWtleS1mb3ItbWljcm9zZXJ2aWNlcy0zMi1ieXRlcw==}

# Gateway routes using Eureka service names with load balancing
# IMPORTANT: More specific routes should come FIRST!

# OAuth2 Callback Route (MOST SPECIFIC - MUST BE FIRST!)
# This handles callbacks from GitHub/Google after user approval
spring.cloud.gateway.routes[0].id=oauth2-callback
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/login/oauth2/code/**

# OAuth2 Authorization Routes (Spring Security endpoints)
spring.cloud.gateway.routes[1].id=login-oauth2-authorization
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/login/oauth2/authorization/**

# OAuth2 Custom Authorization Routes (/oauth2/authorize/*)
spring.cloud.gateway.routes[2].id=oauth2-authorization
spring.cloud.gateway.routes[2].uri=lb://auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/oauth2/**

# Auth Service REST API Routes
spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/auth/**

# QMA Service Routes - Quantities
spring.cloud.gateway.routes[4].id=qma-service
spring.cloud.gateway.routes[4].uri=lb://qma-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/quantities/**

# User History Routes
spring.cloud.gateway.routes[5].id=user-history
spring.cloud.gateway.routes[5].uri=lb://qma-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/user-history/**

# Operation History Routes
spring.cloud.gateway.routes[6].id=operation-history
spring.cloud.gateway.routes[6].uri=lb://qma-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/operation-history/**

# QMA Service Health Check
spring.cloud.gateway.routes[7].id=qma-health
spring.cloud.gateway.routes[7].uri=lb://qma-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
