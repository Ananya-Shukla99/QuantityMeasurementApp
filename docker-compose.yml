version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.36-alpine
    container_name: qma-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: quantity_measurement_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - qma-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
      interval: 5s

  # ─────────────────────────────────────────────────────────────────────────────
  # Quantity Measurement App (Monolithic - Port 8080)
  # ─────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qma-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: quantity-measurement-app
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quantity_measurement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_WEB_CORS_ALLOWED_ORIGINS: https://quantity-measurement-app-frontend-olive.vercel.app,http://localhost:4200,http://localhost:4300
      SPRING_WEB_CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS,PATCH
      SPRING_WEB_CORS_ALLOWED_HEADERS: "*"
      SPRING_WEB_CORS_ALLOW_CREDENTIALS: "true"
      SPRING_WEB_CORS_MAX_AGE: "3600"
      APP_OAUTH2_REDIRECT_URI: https://quantity-measurement-app-frontend-olive.vercel.app/oauth2/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-Ov23liAGvsm2eM8HNY9s}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-5dc37a96cf51b8b82b16cf0330b174a0dfb75bc6}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-696766062956-3d57dv7k62mvb4ndg2ndtnvsfm2j47o1.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      JWT_SECRET: ${JWT_SECRET:-cXVhbnRpdHktbWVhc3VyZW1lbnQtZGV2LWtleS1mb3ItbWljcm9zZXJ2aWNlcy0zMi1ieXRlcw==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      LOGGING_LEVEL_COM_APP: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    ports:
      - "8080:8080"
    networks:
      - qma-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      timeout: 10s
      retries: 3
      interval: 30s
      start_period: 40s

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  qma-network:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local



