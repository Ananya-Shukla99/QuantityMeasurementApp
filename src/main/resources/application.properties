spring.application.name=quantity-measurement-app

# ─────────────────────────────────────────────────────────────────────────────
# Database Configuration (Override with .env for sensitive data)
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quantity_measurement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# Logging Configuration
# ─────────────────────────────────────────────────────────────────────────────
logging.level.com.app=${LOGGING_LEVEL_COM_APP:DEBUG}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:DEBUG}
logging.level.org.hibernate.SQL=DEBUG

# ─────────────────────────────────────────────────────────────────────────────
# Actuator & Monitoring
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# ─────────────────────────────────────────────────────────────────────────────
# API Documentation (Swagger/OpenAPI)
# ─────────────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─────────────────────────────────────────────────────────────────────────────
# CORS Configuration for Frontend (Override with .env if needed)
# ─────────────────────────────────────────────────────────────────────────────
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://quantity-measurement-app-frontend-olive.vercel.app,http://localhost:4200,http://localhost:4300}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ─────────────────────────────────────────────────────────────────────────────
# OAuth2 Configuration (Load from .env for security)
# ─────────────────────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# OAuth2 Client Provider Settings
spring.security.oauth2.client.provider.github.user-name-attribute=login
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ─────────────────────────────────────────────────────────────────────────────
# Application OAuth2 Redirect URI (Override with .env for production)
# ─────────────────────────────────────────────────────────────────────────────
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:https://quantity-measurement-app-frontend-olive.vercel.app/oauth2/callback}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://quantity-measurement-app-frontend-olive.vercel.app,http://localhost:4200,http://localhost:4300}

# ─────────────────────────────────────────────────────────────────────────────
# JWT Configuration (Load from .env for security)
# ─────────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-key-for-testing-only-not-for-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─────────────────────────────────────────────────────────────────────────────
# Frontend OAuth2 Callback
# ─────────────────────────────────────────────────────────────────────────────
frontend.oauth2-redirect-uri=${OAUTH2_REDIRECT_URI:https://quantity-measurement-app-frontend-olive.vercel.app/oauth2/callback}
frontend.login-redirect=https://quantity-measurement-app-frontend-olive.vercel.app/quantity
