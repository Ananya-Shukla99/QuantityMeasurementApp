spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# MySQL Database Configuration (Production)
# Credentials are loaded from .env file via environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/quantity_measurement_auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root123}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info

# JWT Configuration
# Loaded from .env file
jwt.secret=${JWT_SECRET:cXVhbnRpdHktbWVhc3VyZW1lbnQtZGV2LWtleS1mb3ItbWljcm9zZXJ2aWNlcy0zMi1ieXRlcw==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth2 GitHub Configuration
# Credentials are loaded from .env file via environment variables
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=${GITHUB_SCOPE:user:email,read:user}
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8081/login/oauth2/code/github}
spring.security.oauth2.client.registration.github.client-name=GitHub

# OAuth2 Google Configuration
# Credentials are loaded from .env file via environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:email,profile}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.client-name=Google

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# CORS Configuration
# Loaded from .env file
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
oauth2.redirect.uri=${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/callback}

# Eureka Configuration
# Loaded from .env file
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
